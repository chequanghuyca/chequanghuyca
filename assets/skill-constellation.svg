<svg xmlns="http://www.w3.org/2000/svg" width="800" height="52" aria-labelledby="title description">
    <defs>
        <linearGradient id="prefix__accent" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#22d3ee" />
            <stop offset=".5" stop-color="#818cf8" />
            <stop offset="1" stop-color="#e879f9" />
        </linearGradient>
    </defs>
    <style>
        @keyframes cycle {
            0% {
                opacity: 0;
                transform: translateY(5px)
            }

            28%,
            5% {
                opacity: 1;
                transform: translateY(0)
            }

            33%,
            to {
                opacity: 0;
                transform: translateY(-5px)
            }
        }

        @keyframes trace {

            0%,
            to {
                stroke-dashoffset: 220;
                opacity: .3
            }

            50% {
                stroke-dashoffset: 0;
                opacity: 1
            }
        }

        .prefix__line {
            opacity: 0;
            transform-box: fill-box;
            transform-origin: center;
            animation: cycle 12s ease-in-out infinite
        }

        @media (prefers-reduced-motion:reduce) {
            .prefix__line {
                animation: none
            }

            .prefix__line-one {
                opacity: 1
            }
        }
    </style>
    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="15" font-weight="600" letter-spacing="1.2" text-anchor="middle"><text
            class="prefix__line prefix__line-one" x="400" y="27" fill="#38bdf8">TypeScript · JavaScript · Go ·
            Rust</text><text class="prefix__line" x="400" y="27" fill="#818cf8" style="animation-delay:4s">React ·
            Next.js · NestJS · GraphQL</text><text class="prefix__line" x="400" y="27" fill="#c084fc"
            style="animation-delay:8s">Docker · Cloudflare · Tauri · Web3 · AI</text></g>
    <path d="M290 43h220" fill="none" stroke="url(#prefix__accent)" stroke-width="1.5" stroke-linecap="round"
        stroke-dasharray="220" style="animation:trace 3s ease-in-out infinite" />
</svg>
