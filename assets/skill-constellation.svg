<svg xmlns="http://www.w3.org/2000/svg" width="900" height="68" aria-labelledby="title description">
    <defs>
        <linearGradient id="prefix__accent" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#22d3ee" />
            <stop offset=".5" stop-color="#818cf8" />
            <stop offset="1" stop-color="#e879f9" />
        </linearGradient>
    </defs>
    <style>
        @keyframes typing {
            0% {
                opacity: 1;
                clip-path: inset(0 100% 0 0)
            }

            18%,
            28% {
                opacity: 1;
                clip-path: inset(0 0 0 0)
            }

            32%,
            to {
                opacity: 0;
                clip-path: inset(0 0 0 0)
            }
        }

        @keyframes blink {

            0%,
            45% {
                opacity: 1
            }

            46%,
            to {
                opacity: 0
            }
        }

        @keyframes trace {

            0%,
            to {
                stroke-dashoffset: 300;
                opacity: .25
            }

            50% {
                stroke-dashoffset: 0;
                opacity: 1
            }
        }

        .prefix__line {
            opacity: 0;
            transform-box: fill-box;
            animation: typing 12s steps(34, end) infinite both
        }

        @media (prefers-reduced-motion:reduce) {
            .prefix__line {
                animation: none
            }
        }
    </style>
    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="26" font-weight="700" letter-spacing="1.3" text-anchor="middle"><text class="prefix__line" x="450"
            y="35" fill="#38bdf8">TypeScript · JavaScript · Go · Rust · Dart</text><text class="prefix__line" x="450" y="35"
            fill="#818cf8" style="animation-delay:4s">React · Next.js · NestJS · GraphQL</text><text
            class="prefix__line" x="450" y="35" fill="#c084fc" style="animation-delay:8s">Docker · Cloudflare · Tauri ·
            Web3 · AI</text></g>
    <path d="M300 57h300" fill="none" stroke="url(#prefix__accent)" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="300" style="animation:trace 3s ease-in-out infinite" />
</svg>
